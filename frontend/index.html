<!DOCTYPE html>
<html>
<head>
    <title>JoSun Stock System</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
    </style>
</head>
<body>
    <h1>📦 รายการสินค้าในสต็อก (JoSun)</h1>
    <div id="loading">กำลังโหลดข้อมูล...</div>
    <table id="stockTable" style="display:none;">
        <thead>
            <tr>
                <th>ชื่อสินค้า</th>
                <th>SKU</th>
                <th>คงเหลือ (คลังหลัก)</th>
                <th>คงเหลือ (สาขา)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        // ไปดึงข้อมูลจาก API หลังบ้าน
        fetch('http://localhost:8000/products')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('tableBody');
                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.product_name}</td>
                            <td>${item.sku}</td>
                            <td>${item.stock_main}</td>
                            <td>${item.stock_branch}</td>
                        </tr>`;
                });
                document.getElementById('loading').style.display = 'none';
                document.getElementById('stockTable').style.display = 'table';
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = '❌ เชื่อมต่อหลังบ้านไม่ได้ (เช็ค Docker ด้วยนะอี้)';
            });
    </script>
</body>
</html>
